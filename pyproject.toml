[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webhdfspy"
version = "1.0.0"
description = "A Python wrapper library to access Hadoop WebHDFS REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Fabio Souto", email = "fabio@fabiosouto.me" },
]
keywords = ["hadoop", "webhdfs", "hdfs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.20.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-requests",
]
docs = [
    "sphinx>=7.0",
    "alabaster>=0.7",
]
kerberos = [
    "requests-kerberos>=0.14",
]

[project.urls]
Homepage = "https://github.com/fasouto/webhdfspy"
Documentation = "http://webhdfspy.readthedocs.org/en/latest/"

[tool.setuptools.packages.find]
include = ["webhdfspy*"]

[tool.setuptools.package-data]
webhdfspy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: test that needs a running Hadoop cluster (use --integration)",
]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks read more clearly in tests, and test fixture data
# doesn't need ClassVar annotations.
"tests/*" = ["SIM117", "RUF012"]

[tool.mypy]
files = ["webhdfspy"]
strict = true
# WebHDFS responses are untyped JSON, so the accessors genuinely return Any;
# casting each one would assert a shape we cannot actually verify.
warn_return_any = false
